{% extends 'base.html' %}

{% block title %}بازیابی رمز عبور{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="card">
            <div class="card-body" style="padding: 40px;">
                <div class="auth-header">
                    <svg width="60" height="60" viewBox="0 0 24 24" fill="var(--primary-light)" style="margin-bottom: 15px;">
                        <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                    </svg>
                    <h1>بازیابی رمز عبور</h1>
                    <p>ایمیل خود را وارد کنید</p>
                </div>

                <form method="post" novalidate>
                    {% csrf_token %}
                    
                    <div class="form-group">
                        <label class="form-label" for="{{ form.email.id_for_label }}">ایمیل</label>
                        {{ form.email }}
                        {% if form.email.errors %}
                        <div class="form-error">{{ form.email.errors.0 }}</div>
                        {% endif %}
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                        </svg>
                        ارسال لینک بازیابی
                    </button>
                </form>

                <div class="auth-footer">
                    <p><a href="{% url 'accounts:login' %}">بازگشت به صفحه ورود</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
