{% extends 'base.html' %}

{% block title %}رمز عبور تغییر کرد{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="card">
            <div class="card-body" style="padding: 40px;">
                <div class="auth-header">
                    <svg width="60" height="60" viewBox="0 0 24 24" fill="var(--success)" style="margin-bottom: 15px;">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                    </svg>
                    <h1>موفقیت‌آمیز!</h1>
                </div>

                <div class="alert alert-success" style="position: static; margin-bottom: 20px;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                    </svg>
                    رمز عبور شما با موفقیت تغییر کرد. حالا می‌توانید با رمز عبور جدید وارد شوید.
                </div>

                <a href="{% url 'accounts:login' %}" class="btn btn-primary btn-block">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M11 7L9.6 8.4l2.6 2.6H2v2h10.2l-2.6 2.6L11 17l5-5zM20 19h-8v2h8c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-8v2h8v14z"/>
                    </svg>
                    ورود به حساب
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
