{% extends 'base.html' %}

{% block title %}ایمیل بازیابی ارسال شد{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="card">
            <div class="card-body" style="padding: 40px;">
                <div class="auth-header">
                    <svg width="60" height="60" viewBox="0 0 24 24" fill="var(--success)" style="margin-bottom: 15px;">
                        <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
                    </svg>
                    <h1>ایمیل ارسال شد</h1>
                </div>

                <div class="alert alert-success" style="position: static; margin-bottom: 20px;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                    </svg>
                    لینک بازیابی رمز عبور به ایمیل شما ارسال شد. لطفاً ایمیل خود را بررسی کنید.
                </div>

                <p style="color: var(--text-secondary); text-align: center; margin-bottom: 20px;">
                    اگر ایمیلی دریافت نکردید، پوشه اسپم خود را بررسی کنید.
                </p>

                <div class="auth-footer">
                    <p><a href="{% url 'accounts:login' %}">بازگشت به صفحه ورود</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
