<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}تشخیص اسپم فارسی{% endblock %}</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #6366F1;
            --primary-dark: #4F46E5;
            --primary-light: #EEF2FF;
            --pink: #EC4899;
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text: #1E293B;
            --text-2: #64748B;
            --border: #E2E8F0;
            --success: #10B981;
            --success-bg: #ECFDF5;
            --danger: #EF4444;
            --danger-bg: #FEF2F2;
            --warning: #F59E0B;
            --warning-bg: #FFFBEB;
            --info: #3B82F6;
            --radius: 16px;
            --shadow: 0 4px 20px rgba(15, 23, 42, .07);
        }

        body {
            font-family: 'Vazirmatn', Tahoma, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.7;
        }

        /* ---------- هدر و ناوبری ---------- */
        header {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary) 55%, var(--pink));
            color: #fff;
            padding: 22px 0 84px;
        }
        .header-inner {
            max-width: 1000px; margin: 0 auto; padding: 0 20px;
            display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
        }
        .brand { display: flex; align-items: center; gap: 12px; font-size: 1.25rem; font-weight: 800; }
        .brand .logo {
            width: 44px; height: 44px; border-radius: 12px;
            background: rgba(255,255,255,.18); display: grid; place-items: center;
        }
        nav { display: flex; gap: 6px; flex-wrap: wrap; }
        nav a {
            color: #fff; text-decoration: none; font-size: .9rem; font-weight: 500;
            padding: 8px 14px; border-radius: 10px; display: flex; align-items: center; gap: 7px;
            transition: background .15s;
        }
        nav a:hover { background: rgba(255,255,255,.16); }
        nav a.active { background: rgba(255,255,255,.24); font-weight: 700; }
        nav svg { width: 17px; height: 17px; }

        /* ---------- چیدمان ---------- */
        main { max-width: 1000px; margin: -56px auto 48px; padding: 0 20px; }

        .card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 20px; overflow: hidden;
        }
        .card-header {
            padding: 14px 22px; font-weight: 700; font-size: 1rem;
            border-bottom: 1px solid var(--border); background: #FCFDFF;
            display: flex; align-items: center; gap: 9px;
        }
        .card-header svg { width: 19px; height: 19px; color: var(--primary); }
        .card-body { padding: 22px; }

        h1.page-title { font-size: 1.45rem; margin: 6px 0 20px; display: flex; align-items: center; gap: 10px; }
        h1.page-title svg { width: 26px; height: 26px; color: var(--primary); }

        /* ---------- آمار ---------- */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 20px; }
        .stat-card {
            background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
            box-shadow: var(--shadow); padding: 18px; text-align: center; position: relative; overflow: hidden;
        }
        .stat-card::before { content: ''; position: absolute; inset-inline-start: 0; top: 0; bottom: 0; width: 4px; background: var(--primary); }
        .stat-card.green::before { background: var(--success); }
        .stat-card.pink::before { background: var(--pink); }
        .stat-card.amber::before { background: var(--warning); }
        .stat-value { font-size: 1.7rem; font-weight: 800; color: var(--primary-dark); }
        .stat-label { font-size: .82rem; color: var(--text-2); margin-top: 2px; }

        /* ---------- جدول ---------- */
        table.tbl { width: 100%; border-collapse: collapse; font-size: .92rem; }
        table.tbl th, table.tbl td { padding: 11px 14px; text-align: right; border-bottom: 1px solid var(--border); }
        table.tbl th { background: #F8FAFF; color: var(--text-2); font-size: .8rem; font-weight: 700; }
        table.tbl tr:last-child td { border-bottom: none; }
        table.tbl tr:hover td { background: #FAFBFF; }

        /* ---------- بج ---------- */
        .badge {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 3px 12px; border-radius: 99px; font-size: .8rem; font-weight: 700;
        }
        .badge svg { width: 13px; height: 13px; }
        .badge-spam { background: var(--danger-bg); color: var(--danger); }
        .badge-ham { background: var(--success-bg); color: #059669; }
        .badge-warn { background: var(--warning-bg); color: #B45309; }
        .badge-info { background: var(--primary-light); color: var(--primary-dark); }

        /* ---------- دکمه و فرم ---------- */
        .btn {
            display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
            border: none; border-radius: 12px; padding: 11px 22px; font-family: inherit;
            font-size: .95rem; font-weight: 700; text-decoration: none; transition: transform .1s, box-shadow .15s;
        }
        .btn svg { width: 18px; height: 18px; }
        .btn:active { transform: scale(.97); }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; box-shadow: 0 4px 14px rgba(99,102,241,.35); }
        .btn-primary:hover { box-shadow: 0 6px 20px rgba(99,102,241,.45); }
        .btn-ghost { background: #fff; color: var(--primary-dark); border: 2px solid var(--border); }
        .btn-ghost:hover { border-color: var(--primary); }
        .btn-block { width: 100%; justify-content: center; }

        textarea, input[type=number], input[type=file] {
            width: 100%; font-family: inherit; font-size: .95rem; color: var(--text);
            border: 2px solid var(--border); border-radius: 12px; padding: 12px 14px; background: #fff;
        }
        textarea:focus, input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(99,102,241,.12); }
        textarea { min-height: 140px; resize: vertical; }
        label { display: block; font-weight: 700; font-size: .88rem; margin-bottom: 8px; color: var(--text-2); }

        /* ---------- نوار احتمال ---------- */
        .prob-bar { height: 12px; border-radius: 99px; background: var(--success-bg); overflow: hidden; direction: ltr; }
        .prob-bar > div { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--warning), var(--danger)); }

        /* ---------- هشدار ---------- */
        .alert { padding: 14px 18px; border-radius: 12px; margin-bottom: 18px; font-weight: 500; display: flex; gap: 10px; align-items: center; }
        .alert svg { width: 20px; height: 20px; flex-shrink: 0; }
        .alert-error { background: var(--danger-bg); color: var(--danger); border: 1px solid #FECACA; }
        .alert-success { background: var(--success-bg); color: #047857; border: 1px solid #A7F3D0; }
        .alert-warn { background: var(--warning-bg); color: #B45309; border: 1px solid #FDE68A; }

        footer { text-align: center; color: var(--text-2); font-size: .8rem; padding: 20px; }

        .muted { color: var(--text-2); font-size: .85rem; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 720px) { .grid-2 { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <svg width="0" height="0" style="position:absolute">
        <defs>
            <symbol id="i-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></symbol>
            <symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></symbol>
            <symbol id="i-bot" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><path d="M8 16h.01M16 16h.01"/></symbol>
            <symbol id="i-pen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></symbol>
            <symbol id="i-folder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></symbol>
            <symbol id="i-chart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18 17V9M13 17V5M8 17v-3"/></symbol>
            <symbol id="i-db" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/></symbol>
            <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></symbol>
            <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></symbol>
            <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.7 3.86a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></symbol>
            <symbol id="i-spark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/></symbol>
            <symbol id="i-upload" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5M12 3v12"/></symbol>
            <symbol id="i-gauge" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></symbol>
            <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></symbol>
        </defs>
    </svg>

    <header>
        <div class="header-inner">
            <div class="brand">
                <span class="logo"><svg width="24" height="24"><use href="#i-shield"/></svg></span>
                تشخیص اسپم فارسی
            </div>
            <nav>
                <a href="{% url 'home' %}" class="{% if request.resolver_match.url_name == 'home' %}active{% endif %}"><svg><use href="#i-home"/></svg>خانه</a>
                <a href="{% url 'train' %}" class="{% if request.resolver_match.url_name == 'train' %}active{% endif %}"><svg><use href="#i-bot"/></svg>آموزش مدل</a>
                <a href="{% url 'test_text' %}" class="{% if request.resolver_match.url_name == 'test_text' %}active{% endif %}"><svg><use href="#i-pen"/></svg>تست متن</a>
                <a href="{% url 'test_file' %}" class="{% if request.resolver_match.url_name == 'test_file' %}active{% endif %}"><svg><use href="#i-folder"/></svg>تست فایل</a>
            </nav>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>سیستم تشخیص اسپم فارسی — مدل Calibrated LinearSVC نسخه ۳ (آموزش‌دیده روی ایمیل + پیامک)</footer>
</body>
</html>
